<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>to-do-list</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="body">
    <div class="container">
        <h1>to-do-list</h1>
        <div class="header">
            <h2><i class="fas fa-address-book"></i> Gerador de contatos</h2>
            <p>Gerencie seus contatos de forma simples e eficiente</p>
        </div>
        <div class="form-container">
            <form id="form-contatos" action="">
                <div class="form-group">
                    <label for="nome">
                        <i class="fas fa-user"></i> Full Name
                    </label>
                    <input type="text" class="form-control" id="nome" name="nome" placeholder="Nome completo" required>
                    <small>Exempl. Fulano da Silva Rocha</small>
                </div>
                <div class="form-group">
                    <label for="cpf">
                        <i class="fas fa-id-card"></i> C.P.F
                    </label>
                    <input type="text" class="form-control" id="cpf" name="cpf" placeholder="000.000.000-00" required maxlength="11">
                </div>
                <div class="form-group">
                    <label for="telefone">
                        <i class="fas fa-phone"></i> Telefone
                    </label>
                    <input type="text" class="form-control" id="telefone" name="telefone" placeholder="(00).9.9999-9999" required>
                </div>
                <div class="form-group">
                    <button type="submit" id="btn-salvar" class="btn btn-primary">
                        <i class="fas fa-plus"></i> Adicionar contato
                    </button>
                </div>
                <div class="form-group">
                    <button type="button" id="btn-cancelar" 
                    class="btn btn-segundary" 
                    onclick="gerenciador.cancelarEdicao()" 
                    style="display: none;">
                        <i class="fas fa-times"></i> Cancelar
                    </button>
                </div>
            </form>
        </div>
        <div class="tabela-container">
            <div class="table-header">
                <h3><i class="fas fa-list"></i> Lista de contatos</h3>
                <div class="table-actions">
                    <button class="btn btn-sm btn-segundary" 
                    onclick="gerenciador.exportarContatos()"> 
                        <i class="fas fa-download"></i> Exportar
                    </button>
                    <input type="file" id="importar-arquivo" 
                    accept=".json" style="display: none;" 
                    onchange="gerenciador.importarContatos(this.files[0])">
                    <button type="button" class="btn btn-sm btn-segundary" 
                    onclick="document.getElementById('importar-arquivo').click()">
                        <i class="fas fa-upload"></i> Importar
                    </button>
                </div>
            </div>
            <table class="table">
                <thead>
                    <tr>
                        <th><i class="fas fa-user"></i> Nome</th>
                        <th><i class="fas fa-id-card"></i> CPF</th>
                        <th><i class="fas fa-phone"></i> Telefone</th>
                        <th><i class="fas fa-calendar"></i> Data Cadastro</th>
                        <th><i class="fas fa-cogs"></i> Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-corpo">
                    <!-- Os contatos serão inseridos aqui dinamicamente -->
                </tbody>
            </table>
        </div>
    </div>
</body>
<script type="module" src="script/script.js"></script>

</html>
